name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Run synthetic and repository tests
        run: make test

  canonical-baseline:
    runs-on: ubuntu-latest
    env:
      ODMK_REQUIRE_CANONICAL_DATA: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Install independent R baseline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-digest r-cran-haven r-cran-survey
      - name: Acquire and verify canonical public data
        run: |
          mkdir -p sources data_raw
          curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 300 \
            'https://hints.cancer.gov/dataset/HINTS-5_Cycle2_STATA_20240507.zip' \
            -o sources/HINTS5_Cycle2_STATA_20240507.zip
          echo 'f204a161868056e243a3583ec343e3f4e4eb0b430a100e4d0e61996551a8b6ea  sources/HINTS5_Cycle2_STATA_20240507.zip' | sha256sum -c -
          unzip -j sources/HINTS5_Cycle2_STATA_20240507.zip \
            'hints5_cycle2_public.dta' -d data_raw
          echo 'a727f1b7a56f293dc2212bb9cc8705cacdc4e57d6d8e5505012b713ecfd1531f  data_raw/hints5_cycle2_public.dta' | sha256sum -c -
      - name: Reproduce the registered canonical baseline
        run: |
          python src/run_registered_baseline.py
          test -s outputs/registered_baseline/results.csv
          test -s outputs/registered_baseline/validation.json
          test -s outputs/registered_baseline/run_metadata.json
          python -m pytest -q tests/test_real_baseline.py
      - name: Cross-check the baseline independently in R
        run: |
          make independent-r-baseline
          test -s outputs/independent_r_baseline/results.csv
          test -s outputs/independent_r_baseline/metadata.csv
          test -s outputs/independent_r_baseline/comparison.csv
          test -s outputs/independent_r_baseline/validation.json
