paper_id: ODMK
frozen_on: "2026-10-15"
status: "proposed_pending_cos_review"
revision: 7
revision_note: >-
  Replaces the conditional Table 3 Model 1 design after the COS sourcing sheet
  became available. The assigned result is the Table 2 descriptive PPPCQ mean
  comparison between Asian and non-Hispanic White respondents. The adjusted
  model, covariate-missingness, age-form, and fractional-logit dimensions from
  revision 6 are retired. No alternative effect estimate was run in making
  this revision.

focal_published_result:
  source: "COS available-papers sheet, paper ID ODMK"
  table_model: "Table 2, PPPCQ column"
  claim: >-
    Asian respondents had lower mean perceived patient-provider communication
    quality than non-Hispanic White respondents.
  published_asian_mean: 3.11
  published_asian_se: 0.10
  published_asian_ci: [2.90, 3.33]
  published_white_mean: 3.45
  published_white_se: 0.02
  published_white_ci: [3.39, 3.49]
  published_difference_printed: false
  derived_baseline_difference: -0.32961721731883653
  derived_baseline_difference_se_jk1: 0.10974269373470233
  direction: "Asian minus non-Hispanic White"
  note: >-
    The article inferred a group difference from the displayed marginal
    confidence intervals. The robustness results will record both weighted
    group means and their direct Asian-minus-White contrast. The direct
    contrast is derived from the published-baseline reconstruction, not printed
    in the article.

focal_estimand: >-
  Difference between the survey-weighted population mean PPPCQ score for
  non-Hispanic Asian adults and the corresponding mean for non-Hispanic White
  adults in the intended HINTS 5 Cycle 2 patient-provider communication module
  population, on the 1-4 scale. Each registered option is an operational choice
  about membership, measurement, race-category construction, or survey
  variance for this same descriptive contrast. No causal interpretation is made.

fixed:
  dataset: "HINTS 5 Cycle 2 public-use release 2024-05-07"
  data_sha256: "a727f1b7a56f293dc2212bb9cc8705cacdc4e57d6d8e5505012b713ecfd1531f"
  unique_id: "HHID"
  point_weight: "PERSON_FINWT0"
  outcome_items:
    - ChanceAskQuestions
    - FeelingsAddressed
    - InvolvedDecisions
    - UnderstoodNextSteps
    - ExplainedClearly
    - SpentEnoughTime
    - HelpUncertainty
  outcome_valid_values: [1, 2, 3, 4]
  outcome_reverse_rule: "5 - source response"
  outcome_reporting_scale: "1-4"
  reference_group: >-
    Non-Hispanic White respondents identified by RaceEthn5=1 under both d04
    options. The reference is not broadened to any-White identification.
  no_imputation: >-
    No race, outcome item, score, routing field, weight, or design variable is
    imputed in any registered specification.
  survey_domain_estimation: >-
    Create each survey design from the full public-use file before applying
    eligibility, score-availability, or race restrictions. Represent those
    restrictions as survey domains so that non-domain records and released
    design units remain available to variance estimation. Never construct a
    design from a prefiltered Asian-and-White-only file.

dimensions:
  d01_analytic_sample:
    baseline: content_confirmed_module
    options:
      content_confirmed_module: >-
        FreqGoProvider in {1,2,3,4,5,6} OR at least one valid C4 response.
        This follows the NCI edit rule that a missing filter remains missing
        when a follow-up was answered.
      observed_positive_filter_only: >-
        Require FreqGoProvider in {1,2,3,4,5,6}. Do not use answered follow-up
        content to repair or override a missing routing filter.
  d03_outcome_construction:
    baseline: require_7_of_7_valid_items
    options:
      require_7_of_7_valid_items: >-
        Reverse-score and equally average all seven items only when all seven
        source responses are valid.
      require_at_least_4_of_7_valid_items: >-
        Reverse-score and equally average the available items when at least
        four of the same seven source responses are valid. No item is imputed.
  d04_main_predictor_construction:
    baseline: official_mutually_exclusive_raceethn5
    options:
      official_mutually_exclusive_raceethn5: >-
        Asian is RaceEthn5=4 and White is RaceEthn5=1. Multiracial
        non-Hispanic respondents remain in RaceEthn5=5 (Other).
      inclusive_nonhispanic_any_asian_identification: >-
        Asian is Hisp_Cat=10 and at least one of AsInd, Chinese, Filipino,
        Japanese, Korean, Vietnamese, or OthAsian equals 1, including
        respondents who also selected another race. White remains RaceEthn5=1.
  d08_variance_estimation:
    baseline: official_jk1_replicate_weights
    options:
      official_jk1_replicate_weights: >-
        Use PERSON_FINWT1-PERSON_FINWT50, JK1 coefficient 0.98, and 49
        denominator degrees of freedom.
      taylor_linearization: >-
        Use PERSON_FINWT0 with VAR_STRATUM and VAR_CLUSTER and 98 denominator
        degrees of freedom, following the HINTS 5 Cycle 2 analytics guidance.

fixed_dimension_statuses:
  d02_missing_data:
    status: set_aside
    reason: >-
      Partial outcome-item missingness is handled transparently by d03. Item-level
      multiple imputation would add an extensive, unvalidated response model and
      overlaps the registered scale-completeness decision. Race imputation is not
      used for a focal comparison defined by self-identified race/ethnicity.
  d05_cutpoints_categories:
    status: not_applicable
    reason: >-
      The focal outcome remains continuous on 1-4 and no continuous predictor or
      control variable is categorized. The count of valid scale items belongs to
      d03 rather than an outcome cutpoint.
  d06_control_variables:
    status: no_alternative_available
    reason: >-
      Table 2 reports unadjusted survey-weighted means. Adding controls would
      replace the assigned marginal mean contrast with an adjusted contrast.
  d07_model_functional_form:
    status: no_alternative_available
    reason: >-
      Direct design-weighted group means are the assigned quantity. A weighted
      linear model with group indicators is algebraically equivalent, while
      ordinal, median, or robust-location models estimate different quantities.
  d09_survey_weights:
    status: no_alternative_available
    reason: >-
      PERSON_FINWT0 is required for the same national population target.
      Unweighted means target the realized respondent sample, not that population.

cell_construction:
  order:
    - d01_analytic_sample
    - d03_outcome_construction
    - d04_main_predictor_construction
    - d08_variance_estimation
  expected_specifications: 16
  distinct_point_estimate_constructions: 8
  full_factorial: true
  baseline_cell:
    d01_analytic_sample: content_confirmed_module
    d03_outcome_construction: require_7_of_7_valid_items
    d04_main_predictor_construction: official_mutually_exclusive_raceethn5
    d08_variance_estimation: official_jk1_replicate_weights
  point_estimate_invariance: >-
    The d08 choice must not change either weighted group mean or their
    difference, because both options use PERSON_FINWT0 for point estimation.

estimands_and_outputs:
  asian_mean: "sum(w_i*y_i)/sum(w_i) among records in the selected Asian group"
  white_mean: "sum(w_i*y_i)/sum(w_i) among records with RaceEthn5=1"
  focal_difference: "asian_mean - white_mean"
  required_per_cell:
    - asian_mean
    - white_mean
    - asian_minus_white_difference
    - standard_error_of_difference
    - confidence_interval_95
    - test_statistic
    - denominator_degrees_of_freedom
    - two_sided_p_value
    - unweighted_asian_n
    - unweighted_white_n
    - weighted_asian_denominator
    - weighted_white_denominator
    - all_option_labels
    - success_or_failure_reason

variance_algorithms:
  jk1:
    full_estimate: "theta_0 from PERSON_FINWT0"
    replicate_estimates: "theta_r from PERSON_FINWTr for r=1,...,50"
    variance: "0.98 * sum_r((theta_r-theta_0)^2)"
    degrees_of_freedom: 49
  taylor:
    design: >-
      Stratified two-PSU design using VAR_STRATUM and VAR_CLUSTER, with
      PERSON_FINWT0 as the probability weight.
    estimator: >-
      Linearize each weighted ratio mean and their difference; compute the
      stratum-within-PSU variance using the released public design fields.
    degrees_of_freedom: 98

structural_anchors:
  source_rows: 3504
  content_confirmed_module_n: 2993
  observed_positive_filter_n: 2961
  complete_7_n_content_confirmed: 2871
  complete_7_official_asian_n_content_confirmed: 105
  complete_7_inclusive_asian_n_content_confirmed: 122
  complete_7_white_n_content_confirmed: 1703
  inclusive_asian_additional_multiracial_n_full_source: 21
  note: >-
    These are membership and missingness counts only. No alternative outcome
    mean or Asian-minus-White effect was calculated during revision 7 design.

failure_policy:
  - Do not change a registered inclusion, scoring, race, or variance rule after inspecting an effect.
  - Do not merge race categories or substitute an unregistered estimator when a cell is sparse.
  - Stop before effect estimation if the full analytic survey domain does not preserve both public strata and all 50 released clusters within each stratum; do not assess this by filtering to focal-group records first.
  - Failed cells remain in the results file with the reason and no focal estimate.

execution_gates:
  - "source SHA-256 equals the registered canonical hash"
  - "required schema is present and HHID is unique and nonmissing"
  - "published-baseline analytic N equals 2611"
  - "each displayed baseline race/ethnicity mean is within 0.011 of the article"
  - "exactly 50 replicate weights are present"
  - "Taylor design contains two strata and 50 released clusters per stratum (98 design degrees of freedom)"
  - "the registry expands to exactly 16 cells and 8 distinct point-estimate constructions"
  - "d08 paired cells have identical point estimates"

execution_provenance:
  required:
    - source_data_hash
    - registry_revision
    - code_commit
    - language_and_runtime_version
    - package_versions
    - ai_system_and_use_date
    - researcher_approval_record
    - cell_manifest_with_status_and_failure_reason

software_plan:
  baseline_crosscheck: "Python explicit weighted means and JK1 formula"
  production: "R survey package; exact R/package versions frozen before alternatives"
  jk1_design: >-
    Supplied PERSON_FINWT0 and PERSON_FINWT1-PERSON_FINWT50 as combined
    weights; variance centered on the full-sample estimate; scale 0.98; df 49.
  taylor_design: >-
    PERSON_FINWT0 with VAR_STRATUM and VAR_CLUSTER; nested public design; df 98.
  domain_rule: >-
    Construct the survey design on the full source file, then apply sample,
    score availability, and racial group membership as domains.

reporting:
  attempt_and_list_all_cells: true
  primary_display: "4 by 4 table or equivalent specification plot showing all 16 cells"
  prohibited_summaries:
    - significance_only_robustness_rate
    - post_result_preferred_specification
    - pooled_claim_that_ignores_estimate_magnitude_and_uncertainty
  interpretation: >-
    Describe how the magnitude and uncertainty of the Asian-minus-White mean
    difference vary across peer choices. Do not treat p<.05 as the definition
    of robustness.

preanalysis_guard:
  allowed_before_cos_approval:
    - published_baseline_reconstruction
    - source_hash_and_schema_checks
    - membership_and_missingness_counts
    - verification_of_race_source_logic
    - design_structure_checks_that_do_not_estimate_group_outcomes
  forbidden_before_cos_approval:
    - any_nonbaseline_group_mean
    - any_nonbaseline_asian_minus_white_difference
    - any_selection_or_revision_based_on_nonbaseline_effects
